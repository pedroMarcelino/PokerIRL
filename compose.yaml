name: pokerirl

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pokerirl-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    # O .env fica no host e é injetado em runtime; nunca é copiado para a imagem.
    env_file:
      - path: ./apps/server/.env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000/ws}
    container_name: pokerirl-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
