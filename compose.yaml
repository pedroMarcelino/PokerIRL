name: pokerirl

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: pokerirl-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    # O .env fica no host e é injetado em runtime; nunca é copiado para a imagem.
    # A ordem importa: em caso de conflito, o último arquivo prevalece.
    # Assim o .env da raiz (fonte principal) vence o legado apps/server/.env.
    env_file:
      - path: ./apps/server/.env
        required: false
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pokerirl-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
